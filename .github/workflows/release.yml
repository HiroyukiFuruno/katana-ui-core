name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crates:
        description: "Publish katana-ui-core to crates.io after GitHub Release is created"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: read

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Gate manifest, release-check, tag, and publish must all identify this immutable event SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install ast-lint
        run: just ast-lint-install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install headless display
        run: bash scripts/ci/install-headless-display.sh

      - name: Resolve version
        id: version
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.event.pull_request.head.ref }}"

      - name: Lightweight release preflight
        run: just fmt-check ast-lint

      - name: Prepare release gate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
        run: |
          unresolved=0
          if [[ -n "${PR_NUMBER}" ]]; then
            query='query($owner:String!,$repo:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage,endCursor}}}}}'
            unresolved="$(gh api graphql --paginate --slurp -f query="${query}" -F owner="${GITHUB_REPOSITORY%%/*}" -F repo="${GITHUB_REPOSITORY##*/}" -F number="${PR_NUMBER}" -F endCursor=null --jq '[.[].data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          fi
          python3 scripts/release/verify-release-gate.py \
            --write-manifest "${GATE_MANIFEST}" \
            --sha "${GITHUB_SHA}" \
            --unresolved-review-threads "${unresolved}" \
            --preflight-status passed

      - name: Verify release gate start conditions
        id: release_gate_start
        env:
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
          GATE_STATE: ${{ runner.temp }}/kuc-release-gate-state.json
        run: python3 scripts/release/verify-release-gate.py --manifest "${GATE_MANIFEST}" --expected-sha "${GITHUB_SHA}" --phase start --state-output "${GATE_STATE}"

      - name: Find verified reusable release check
        id: reusable_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ runner.temp }}/kuc-release-check-evidence
        run: |
          mkdir -p "${EVIDENCE_ROOT}"
          echo "reuse=false" >> "${GITHUB_OUTPUT}"
          while read -r run_id; do
            candidate_dir="${EVIDENCE_ROOT}/${run_id}"
            mkdir -p "${candidate_dir}"
            if ! gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name kuc-release-check-evidence --dir "${candidate_dir}"; then
              continue
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${candidate_dir}/source-run.json"; then
              continue
            fi
            source_sha="$(jq -r '.head_sha // empty' "${candidate_dir}/source-run.json")"
            if [[ -z "${source_sha}" ]] || ! git fetch --no-tags origin "${source_sha}"; then
              continue
            fi
            if python3 scripts/release/verify-reusable-release-evidence.py \
              --candidate "${candidate_dir}/release-evidence.json" \
              --source-run "${candidate_dir}/source-run.json" \
              --repository "${GITHUB_REPOSITORY}"; then
              echo "reuse=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow release-preflight.yml --status success --limit 50 --json databaseId --jq '.[].databaseId')
          echo "release evidence reuse unavailable; running the required release check."

      - name: Release check
        id: release_check
        if: steps.reusable_evidence.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KUC_COVERAGE_EPHEMERAL_CLEANUP: "1"
        run: just VERSION="${{ steps.version.outputs.version }}" release-check

      - name: Public release boundary
        if: steps.release_check.outcome == 'success' || steps.reusable_evidence.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          just VERSION="${{ steps.version.outputs.version }}" release-target-check
          bash scripts/release/assert-crate-not-published.sh "${{ steps.version.outputs.version }}"

      - name: Record release gate result
        if: always()
        env:
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
          GATE_STATE: ${{ runner.temp }}/kuc-release-gate-state.json
          GATE_RESULT: ${{ (steps.release_check.outcome == 'success' || steps.reusable_evidence.outputs.reuse == 'true') && 'passed' || 'failed' }}
        run: |
          python3 scripts/release/verify-release-gate.py \
            --manifest "${GATE_MANIFEST}" \
            --expected-sha "${GITHUB_SHA}" \
            --phase complete \
            --state-input "${GATE_STATE}" \
            --state-output "${GATE_STATE}" \
            --result "${GATE_RESULT}"

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Create GitHub Release
        id: create_github_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest --verify-tag
          else
            gh release create "${TAG}" --verify-tag --latest --generate-notes
          fi
      - name: Authenticate with crates.io
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates.io
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh "${{ steps.version.outputs.version }}"
      - name: Cleanup merged release branches
        if: steps.create_github_release.outcome == 'success' && (github.event_name == 'pull_request' || inputs.publish_crates == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/cleanup-release-branches.py --version "${{ steps.version.outputs.version }}"
