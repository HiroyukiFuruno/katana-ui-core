name: Native IME compile contract

on:
  workflow_call:
  push:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-ime-contract.yml'
      - 'docs/native-ime-evidence.md'
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-ime-contract.yml'
      - 'docs/native-ime-evidence.md'

concurrency:
  group: native-ime-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  compile-contract:
    name: Compile contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Linux GUI headers
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/install-headless-display.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-ime-contract-${{ matrix.os }}

      - name: Run core registry verifier contract
        id: verifier
        run: cargo test -p katana-ui-core --no-default-features --features native-ime-evidence --test native_ime_evidence_contract --test native_ime_verify_cli_contract --locked

      - name: Run native Unicode session contract
        id: session
        run: cargo test -p katana-ui-core --features egui,native-ime-evidence --test native_unicode_session_contract --locked

      - name: Verify bounded lookup and reject invalid native runs
        run: cargo test -p katana-ui-core-native-ime-evidence --locked

      - name: Compile native producer
        id: producer
        run: cargo check -p katana-ui-core-native-ime-evidence --locked

      - name: Lint native producer
        id: lint
        run: cargo clippy -p katana-ui-core -p katana-ui-core-native-ime-evidence --all-targets --all-features --locked -- -D warnings

      - name: Write compile report
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "native IME compile contract"
            echo "os=${{ matrix.os }}"
            echo "sha=${{ github.sha }}"
            echo "job_status=${{ job.status }}"
            echo "verifier_outcome=${{ steps.verifier.outcome }}"
            echo "session_outcome=${{ steps.session.outcome }}"
            echo "producer_outcome=${{ steps.producer.outcome }}"
            echo "lint_outcome=${{ steps.lint.outcome }}"
            echo "native runtime evidence: unavailable (compile contract only)"
            echo "core verifier: no-default-features + native-ime-evidence"
            cargo --version
            rustc --version
          } > artifacts/native-ime-compile-report.txt

      - name: Upload compile report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ime-compile-report-${{ matrix.os }}
          path: artifacts/native-ime-compile-report.txt
          if-no-files-found: error
          archive: true
