name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    # WHY: PR 側で通過済みの merge commit では二重実行せず、直接 push は検証する。
    if: >-
      github.event_name != 'push' || (
        !startsWith(github.event.head_commit.message, 'Merge pull request ') &&
        !contains(github.event.head_commit.message, '(#')
      )
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@f9ee2b3488b5862cca1caf86effaa61f55953001 # cargo-llvm-cov

      - name: Install headless display
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/install-headless-display.sh

      - name: Install ffmpeg on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci/install-ffmpeg.sh

      - name: Install ffmpeg on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install ffmpeg on Windows
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg --yes --no-progress

      - name: Install just
        uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Install ast-lint
        if: matrix.os != 'windows-latest'
        run: just ast-lint-install

      - name: Check types
        run: just check-types

      - name: Verify registry-safe raster host
        if: matrix.os != 'windows-latest'
        run: just raster-host-contract

      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Run linter
        if: matrix.os != 'windows-latest'
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest'
        run: just ast-lint

      - name: Run tests
        run: just unit-test

      - name: Check storybook
        if: matrix.os != 'windows-latest'
        run: just storybook-check

      - name: Run coverage
        # WHY: release PR は release-preflight の release-check が同じ strict coverage を実行する。
        if: >-
          matrix.os == 'ubuntu-latest' &&
          !startsWith(github.head_ref, 'release/v')
        env:
          KUC_COVERAGE_EPHEMERAL_CLEANUP: "1"
        run: just coverage
