name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    # WHY: PR 側で通過済みの merge commit では二重実行せず、直接 push は検証する。
    if: >-
      github.event_name != 'push' || (
        !startsWith(github.event.head_commit.message, 'Merge pull request ') &&
        !contains(github.event.head_commit.message, '(#')
      )
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install headless display
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk fonts-noto-color-emoji fonts-noto-mono xauth xvfb
          mono_font=/usr/share/fonts/truetype/noto/NotoSansMono-Regular.ttf
          emoji_font=/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          expected_hash=93cdc4ee9aa40e2afceecc63da0ca05ec7aab4bec991ece51a6b52389f48a477
          actual_hash="$(sha256sum "${emoji_font}" | cut -d ' ' -f 1)"
          test "${actual_hash}" = "${expected_hash}"
          echo "KUC_PINNED_LINUX_EMOJI_SHA256=${expected_hash}" >> "${GITHUB_ENV}"
          expected_mono_hash=6b692c4b6d15ccf59f1c1fe8d11cb8a92f51960f3e9f1f523781755a3af7e29f
          actual_mono_hash="$(sha256sum "${mono_font}" | cut -d ' ' -f 1)"
          test "${actual_mono_hash}" = "${expected_mono_hash}"

      - name: Install ffmpeg on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install ffmpeg on Windows
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg --yes --no-progress

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install ast-lint
        if: matrix.os != 'windows-latest'
        run: just ast-lint-install

      - name: Check types
        run: just check-types

      - name: Verify registry-safe raster host
        if: matrix.os != 'windows-latest'
        run: just raster-host-contract

      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Run linter
        if: matrix.os != 'windows-latest'
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest'
        run: just ast-lint

      - name: Run tests
        run: just unit-test

      - name: Check storybook
        if: matrix.os != 'windows-latest'
        run: just storybook-check

      - name: Run coverage
        # WHY: release PR は release-preflight の release-check が同じ strict coverage を実行する。
        if: >-
          matrix.os == 'ubuntu-latest' &&
          !startsWith(github.head_ref, 'release/v')
        env:
          KUC_COVERAGE_EPHEMERAL_CLEANUP: "1"
        run: just coverage
