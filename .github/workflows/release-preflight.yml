name: release-preflight

on:
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install ast-lint
        run: just ast-lint-install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install headless display
        run: bash scripts/ci/install-headless-display.sh

      - name: Install ffmpeg for release check
        run: bash scripts/ci/install-ffmpeg.sh

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        shell: bash
        run: bash scripts/release/resolve-release-version.sh "${{ github.event_name }}" "" "${{ github.head_ref }}"

      - name: Lightweight release preflight
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: just fmt-check ast-lint

      - name: Prepare release gate manifest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
        run: |
          unresolved=0
          if [[ -n "${PR_NUMBER}" ]]; then
            query='query($owner:String!,$repo:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage,endCursor}}}}}'
            unresolved="$(gh api graphql --paginate -f query="${query}" -F owner="${GITHUB_REPOSITORY%%/*}" -F repo="${GITHUB_REPOSITORY##*/}" -F number="${PR_NUMBER}" -F endCursor=null | jq -s '[.[].data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          fi
          python3 scripts/release/verify-release-gate.py \
            --write-manifest "${GATE_MANIFEST}" \
            --sha "${GITHUB_SHA}" \
            --unresolved-review-threads "${unresolved}" \
            --preflight-status passed

      - name: Verify release gate start conditions
        id: release_gate_start
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
          GATE_STATE: ${{ runner.temp }}/kuc-release-gate-state.json
        run: python3 scripts/release/verify-release-gate.py --manifest "${GATE_MANIFEST}" --expected-sha "${GITHUB_SHA}" --phase start --state-output "${GATE_STATE}"

      - name: Quality gate
        # WHY: release PR は直後の release-check が同じ check を内包するため二重実行しない。
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v')
        run: just check

      - name: Release check
        id: release_check
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          KUC_COVERAGE_EPHEMERAL_CLEANUP: "1"
          KUC_COVERAGE_LOG_DIR: ${{ runner.temp }}/kuc-coverage-test-logs
          # 全workspace coverage の実行器を二つの単一thread childに制限し、hosted runner の
          # native UI test が同時に確保する資源を抑える。検査対象とcoverage基準は変えない。
          COVERAGE_TEST_THREADS: "2"
        run: just VERSION="${{ steps.version.outputs.version }}" release-check

      - name: Upload failed coverage test logs
        if: failure() && steps.release_check.outcome == 'failure' && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuc-coverage-test-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/kuc-coverage-test-logs
          if-no-files-found: warn
          retention-days: 7
          archive: true

      - name: Record release gate result
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v'))
        env:
          GATE_MANIFEST: ${{ runner.temp }}/kuc-release-gate-manifest.json
          GATE_STATE: ${{ runner.temp }}/kuc-release-gate-state.json
          GATE_RESULT: ${{ steps.release_check.outcome == 'success' && 'passed' || 'failed' }}
        run: |
          python3 scripts/release/verify-release-gate.py \
            --manifest "${GATE_MANIFEST}" \
            --expected-sha "${GITHUB_SHA}" \
            --phase complete \
            --state-input "${GATE_STATE}" \
            --state-output "${GATE_STATE}" \
            --result "${GATE_RESULT}"

      - name: Record reusable release-check evidence
        if: steps.release_check.outcome == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        env:
          EVIDENCE: ${{ runner.temp }}/kuc-release-check-evidence/release-evidence.json
          # release-check built this exact tag immediately before coverage ran.
          KUC_COVERAGE_IMAGE: katana-ui-core-coverage:rust-1.97.1
        run: |
          python3 scripts/release/verify-reusable-release-evidence.py \
            --write "${EVIDENCE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-id "${GITHUB_RUN_ID}"

      - name: Upload reusable release-check evidence
        if: steps.release_check.outcome == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuc-release-check-evidence
          path: ${{ runner.temp }}/kuc-release-check-evidence/release-evidence.json
          if-no-files-found: error
          archive: true
