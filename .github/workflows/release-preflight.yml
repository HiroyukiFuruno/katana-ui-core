name: release-preflight

on:
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - '.github/workflows/**'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install ast-lint
        run: just ast-lint-install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install headless display
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk fonts-noto-color-emoji fonts-noto-mono xauth xvfb
          mono_font=/usr/share/fonts/truetype/noto/NotoSansMono-Regular.ttf
          emoji_font=/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          expected_hash=93cdc4ee9aa40e2afceecc63da0ca05ec7aab4bec991ece51a6b52389f48a477
          actual_hash="$(sha256sum "${emoji_font}" | cut -d ' ' -f 1)"
          test "${actual_hash}" = "${expected_hash}"
          echo "KUC_PINNED_LINUX_EMOJI_SHA256=${expected_hash}" >> "${GITHUB_ENV}"
          expected_mono_hash=6b692c4b6d15ccf59f1c1fe8d11cb8a92f51960f3e9f1f523781755a3af7e29f
          actual_mono_hash="$(sha256sum "${mono_font}" | cut -d ' ' -f 1)"
          test "${actual_mono_hash}" = "${expected_mono_hash}"

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        shell: bash
        run: bash scripts/release/resolve-release-version.sh "${{ github.event_name }}" "" "${{ github.head_ref }}"

      - name: Quality gate
        # WHY: release PR は直後の release-check が同じ check を内包するため二重実行しない。
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v')
        run: just check

      - name: Release check
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          KUC_COVERAGE_EPHEMERAL_CLEANUP: "1"
        run: just VERSION="${{ steps.version.outputs.version }}" release-check
