[package]
name = "katana-ui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "UI Core for the KatanA ecosystem with optional raster and egui adapters"
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
text-raster = ["dep:cosmic-text", "dep:sha2", "dep:windows-sys"]
svg-raster = ["dep:resvg", "dep:tiny-skia"]
egui = ["dep:egui", "dep:hex", "dep:sha2", "text-raster", "svg-raster"]
storybook-artifacts = ["egui", "dep:image"]

[dependencies]
cosmic-text = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
image = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
unicode-segmentation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
