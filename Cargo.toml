[workspace]
members = [
    "crates/katana-ui-core",
    "crates/katana-ui-core-storybook",
    "examples/kuc-consumer-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-ui-core"
rust-version = "1.95.0"
authors = ["Hiroyuki Furuno"]

[workspace.dependencies]
katana-ui-core = { version = "0.1.0", path = "crates/katana-ui-core" }
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minifb = "0.28.0"
resvg = "0.47"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny-skia = "0.12"
unicode-segmentation = "1.12.0"
